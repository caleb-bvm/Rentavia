name: rentavia
services:
  database:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Configura la contraseña SQL en .env}
    ports:
      - "127.0.0.1:${SQL_PORT:-14330}:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  web:
    image: rentavia-web:local
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      Seguridad__RedirigirHttps: "false"
      ConnectionStrings__Rentavia: "Server=database,1433;Database=Rentavia;User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OpenAI__Modelo: ${OPENAI_MODEL:-gpt-4.1-mini}
      DataProtection__Ruta: /app/keys
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    volumes:
      - uploads:/app/wwwroot/uploads
      - keys:/app/keys
    depends_on:
      database:
        condition: service_healthy
  setup:
    image: rentavia-web:local
    profiles: ["setup"]
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__Rentavia: "Server=database,1433;Database=Rentavia;User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    command: ["--migrate"]
    depends_on:
      database:
        condition: service_healthy
volumes:
  sql-data:
  uploads:
  keys:
